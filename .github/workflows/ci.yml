name: CI

on:
  push:
    # develop as well as main. Work reaches the integration branch by merge and
    # occasionally by direct push, and neither used to run anything here, so a
    # regression could sit on develop until some later pull request inherited it.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes back to the repository. Without a declaration the
# workflow token carries whatever the repository default grants, which is
# usually write, and a checkout plus a third-party dependency install is the
# wrong place to be holding it. Jobs that need more can ask for it locally.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install "ruff==0.15.20"

      - name: Lint
        run: ruff check BalloonPoppingGymEnv/ tests/ doc/examples/

      - name: Format check
        run: ruff format --check BalloonPoppingGymEnv/ tests/ doc/examples/

  test:
    name: Tests and coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Competitors run this on their own machines, and pyproject.toml claims
      # >=3.10, so the floor is tested rather than only asserted. ActiveRocketPy
      # already runs its own CI on 3.10.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Run the opt-in slow regression tests (e.g. the scenario #1 Monte Carlo
      # golden master) in CI; they are skipped by default for fast local runs.
      BPC_RUN_SLOW_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock

      # Install what the lockfile pins, so a green run is a statement about a
      # known set of versions. This used to be `pip install -r
      # requirements-dev.txt`, which carries no pins at all, next to a
      # `uv lock --check` that passed and said nothing about what was then
      # installed: the lockfile pinned matplotlib 3.10.9, numpy 2.4.5 and scipy
      # 1.17.1 while CI resolved 3.11.1, 2.5.1 and 1.18.0. So local runs and CI
      # runs were not testing the same software, and a release on PyPI could
      # turn this red with nothing changed here.
      #
      # `--locked` also fails when uv.lock has gone stale against the
      # ActiveRocketPy submodule, which is what the separate check was for.
      - name: Install the locked dependencies
        run: |
          python -m pip install "uv==0.11.14"
          uv sync --locked --extra dev

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=BalloonPoppingGymEnv --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      # Skipped until a CODECOV_TOKEN repository secret is configured.
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' && matrix.python-version == '3.14' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  latest-dependencies:
    name: Latest dependencies (early warning)
    runs-on: ubuntu-latest
    # The tests above install what the lockfile pins, which is the right thing
    # for a gate: a green run means a known set of versions. It also means
    # nothing here would notice a new release breaking the package.
    #
    # That is not hypothetical. Matplotlib 3.11 took out the default renderer
    # for anyone on the README's pip path (#89), and the only reason CI saw it
    # was that CI was on that path too.
    #
    # So the pip path keeps running, named for what it is, and does not block:
    # a release on PyPI should tell us something rather than stop unrelated work
    # from merging. Fast suite only, because it is looking for import and API
    # breakage rather than trajectory drift.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the newest dependencies pip will resolve
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Report what that resolved to
        run: python -m pip list

      - name: Run tests
        run: pytest tests/ -q
